# Project root docker-compose.yml
#
# Default (no flags):     db + mailpit        -> docker compose up -d
# With Postal as well:    + postal-*          -> docker compose --profile postal up -d
#
# - db:       your app's PostgreSQL
# - mailpit:  local dev inbox, catches all outgoing emails (no domain needed)
#             Web UI: http://localhost:8025   SMTP: localhost:1025
# - postal-*: Postal mail server (optional, needs a real domain to send mail)
#             Web UI: http://localhost:5000   SMTP: localhost:2525

x-postal: &postal
  image: ghcr.io/postalserver/postal:latest
  restart: unless-stopped
  profiles: ["postal"]
  volumes:
    - ./postal/config:/config   # postal.yml + signing.key
  depends_on:
    postal-db:
      condition: service_healthy

services:
  # ---------- Your app database ----------
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Local dev inbox ----------
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # web inbox
      - "1025:1025"   # SMTP

  # ---------- Postal (optional) ----------
  postal-db:
    image: mariadb:11
    restart: unless-stopped
    profiles: ["postal"]
    environment:
      MARIADB_ROOT_PASSWORD: postal
    volumes:
      - postal-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  postal-web:
    <<: *postal
    command: postal web-server
    ports:
      - "5000:5000"

  postal-smtp:
    <<: *postal
    command: postal smtp-server
    ports:
      - "2525:25"

  postal-worker:
    <<: *postal
    command: postal worker

volumes:
  pgdata:
  postal-db-data: